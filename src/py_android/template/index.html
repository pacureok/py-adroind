<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #00ffcc;
            font-family: Arial, sans-serif;
            margin: 0;
            flex-direction: column;
        }
        .loader {
            border: 5px solid #333;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { margin-top: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>App hecha con Android Py de Pacure</h1>
    <script>
        // Cuando Python esté listo, inyectará un evento para cambiar esta vista
        window.addEventListener("PythonReady", function() {
            document.body.innerHTML = "<h1>¡Python está corriendo!</h1>";
        });
    </script>
</body>
</html>
